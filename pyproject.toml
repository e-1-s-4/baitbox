[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baitbox"
version = "2.3.0"
description = "Zero-config multi-protocol honeypot with real-time dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["honeypot", "security", "ssh", "dashboard", "threat-intelligence"]
classifiers = [
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "paramiko>=3.5,<4.0",
    "aiosqlite>=0.21,<1.0",
    "rich>=14,<15",
    "websockets>=15,<16",
    "bcrypt>=4.3",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20",
    "asyncpg>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
baitbox = "baitbox.main:cli"

[tool.setuptools.packages.find]
include = ["baitbox*"]

[tool.setuptools.package-data]
baitbox = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::cryptography.utils.CryptographyDeprecationWarning",
]
